    <form [formGroup]="myReactiveForm" (ngSubmit)="addTask()">
      <input type="text" placeholder="Enter to your task"
             formControlName="name"
      >
      <small *ngIf="myReactiveForm.get('name')?.hasError('required') && myReactiveForm.get('name')?.touched">
        Task is required
      </small>
      <small *ngIf="myReactiveForm.get('name')?.hasError('minlength')">Task must be at least 3 character long</small>
      <label for="quantity"></label>
      <input
        type="number"
        formControlName="quantity"
        id="quantity">
      <small *ngIf="myReactiveForm.get('quantity')?.hasError('required')">Quantity is required</small>
      <small *ngIf="myReactiveForm.get('quantity')?.hasError('min')">
        Minimum value is 1
      </small>
      <small *ngIf="myReactiveForm.get('quantity')?.hasError('max')">
        Maximum value is 5
      </small>

      <button class="add-task" [disabled] = 'myReactiveForm.invalid'>
        Save
      </button>

      <button
        type="button"
        class="close-btn"
        (click)="closeModal()">
        X
      </button>
    </form>
